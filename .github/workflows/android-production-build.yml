name: Android App Release Build

on:
  push:
    branches:
      - development
    tags:
      - 'v*.*.*.prod'
jobs:
  build:
    name: Build and Publish Flutter App
    runs-on: ubuntu-latest

    env:
      # Configure Flutter & Android SDK paths
      FLUTTER_HOME: ${{ runner.tool_cache }}/flutter
      ANDROID_HOME: ${{ runner.tool_cache }}/android-sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Decode Keystore
        env:
          KEYSTORE_JKS_BASE64: ${{ secrets.KEYSTORE_JKS_BASE64 }}
        run: |
          echo "$KEYSTORE_JKS_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Set up Fastlane
        run: |
          gem install bundler
          bundle install --path vendor/bundle

      - name: Publish to Google Play
        env:
          # Fastlane credentials
          ANDROID_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          bundle exec fastlane supply --json_key "$ANDROID_SERVICE_ACCOUNT_JSON" --package_name "com.yourcompany.yourapp" --aab "build/app/outputs/bundle/release/app-release.aab" --track production